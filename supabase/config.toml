[functions.chat]
verify_jwt = false

[functions.ai-summarize]
verify_jwt = false

[functions.ai-insights]
verify_jwt = false

# OAuth callback is hit by Google's browser redirect (no Supabase auth header),
# so it must be public. auth-url/events stay JWT-protected (called via invoke).
[functions.google-calendar-callback]
verify_jwt = false

[functions.google-vision-ocr]
enabled = true
verify_jwt = false
import_map = "./functions/google-vision-ocr/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-vision-ocr/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-vision-ocr/*.html" ]
